# Codecov configuration for purpleair_data_logger
# Documentation: https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 10%
        informational: false
    patch:
      default:
        target: auto
        threshold: 10%
        informational: false

ignore:
  - "tests/**"
  - "python_tests/**"
  - "cpp_tests/**"
  - "behave_tests/**"
  - "test_*.py"
  - "**/test_*.py"
  - "**/*_test.py"
  - "setup.py"
  - "setup.cfg"
  - "tools/**"
  - "release_tools/**"
  - "third_party/**"
  - "generated_swig/**"
  - "bindings/**/generated/**"
  - "purpleair_data_logger/purpleair_data_logger.py"
  - "purpleair_data_logger/purpleair_data_logger_swig.py"
  - "src/purpleair_data_logger_wrap.cxx"
  - ".github/**"
  - "docs/**"
  - "sphinx_docs_build/**"

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: python
      paths:
        - purpleair_data_logger/*.py
        - purpleair_data_logger/**/*.py
    - name: cpp
      paths:
        - include/purpleair_data_logger/*.h
        - src/*.cpp

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: false

component_management:
  individual_components:
    - component_id: python_code
      name: "Python Code"
      paths:
        - purpleair_data_logger/*.py
        - purpleair_data_logger/**/*.py
    - component_id: cpp_code
      name: "C++17 Core Engine"
      paths:
        - include/purpleair_data_logger/*.h
        - src/*.cpp
