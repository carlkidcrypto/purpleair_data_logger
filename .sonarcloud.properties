# SonarQube Cloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/

# Exclude built documentation, workflows, and build artifacts from static code analysis (security, reliability, maintainability)
sonar.exclusions=docs/**,sphinx_docs_build/**,.github/**

# Exclude built documentation, workflows, tests, and sample configs from copy-paste detection (duplication metrics)
sonar.cpd.exclusions=docs/**,sphinx_docs_build/**,.github/**,tests/**,behave_tests/**,sample_json_config_files/**,external_network_hardware_variant_json_samples/**,internal_network_hardware_variant_json_samples/**
