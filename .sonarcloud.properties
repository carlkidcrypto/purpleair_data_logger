# SonarQube Cloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/

sonar.sources=.
sonar.tests=tests,python_tests,cpp_tests
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Exclude built documentation, workflows, third-party code, generated SWIG artifacts, and test code from main sources
sonar.exclusions=docs/**,.github/**,third_party/**,doxygen_docs_build/**,sphinx_docs_build/**,generated_swig/**,**/*_wrap.cxx,purpleair_data_logger/purpleair_data_logger.py,purpleair_data_logger/purpleair_data_logger_swig.py,bindings/**/generated/**,bindings/**/build/**,tests/**,python_tests/**,cpp_tests/**

# Exclude built documentation, workflows, tests, sample configs, and generated code from copy-paste detection (duplication metrics)
sonar.cpd.exclusions=docs/**,.github/**,third_party/**,doxygen_docs_build/**,sphinx_docs_build/**,generated_swig/**,**/*_wrap.cxx,purpleair_data_logger/purpleair_data_logger.py,purpleair_data_logger/purpleair_data_logger_swig.py,bindings/**/generated/**,bindings/**/build/**,tests/**,python_tests/**,cpp_tests/**,behave_tests/**,configs/**,sample_json_config_files/**,external_network_hardware_variant_json_samples/**,internal_network_hardware_variant_json_samples/**
