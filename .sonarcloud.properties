# SonarQube Cloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/

sonar.sources=purpleair_data_logger,include,src,bindings
sonar.tests=tests,python_tests,cpp_tests
sonar.python.version=3.11,3.12,3.13,3.14

# Exclude built documentation, workflows, third-party code, and generated SWIG wrappers from static analysis
sonar.exclusions=docs/**,sphinx_docs_build/**,.github/**,third_party/**,generated_swig/**,**/*_wrap.cxx,purpleair_data_logger/purpleair_data_logger.py,purpleair_data_logger/purpleair_data_logger_swig.py,bindings/**/generated/**

# Exclude built documentation, workflows, tests, and sample configs from copy-paste detection (duplication metrics)
sonar.cpd.exclusions=docs/**,sphinx_docs_build/**,.github/**,tests/**,python_tests/**,cpp_tests/**,behave_tests/**,configs/**,sample_json_config_files/**,external_network_hardware_variant_json_samples/**,internal_network_hardware_variant_json_samples/**
