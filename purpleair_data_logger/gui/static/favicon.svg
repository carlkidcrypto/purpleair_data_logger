<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Violet Pulse Gradient -->
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Cybernetic Glow Border -->
  <rect x="5" y="5" width="118" height="118" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- Sensor Mesh Topology Circuit Lines -->
  <g stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <line x1="28" y1="36" x2="48" y2="22" />
    <line x1="48" y1="22" x2="80" y2="22" />
    <line x1="80" y1="22" x2="100" y2="38" />
    <line x1="100" y1="38" x2="98" y2="68" />
    <line x1="98" y1="68" x2="104" y2="92" />
    <line x1="104" y1="92" x2="78" y2="106" />
    <line x1="78" y1="106" x2="50" y2="106" />
    <line x1="50" y1="106" x2="24" y2="92" />
    <line x1="24" y1="92" x2="30" y2="64" />
    <line x1="30" y1="64" x2="28" y2="36" />

    <!-- Cross links to center hex hub -->
    <line x1="48" y1="22" x2="64" y2="42" stroke="#c084fc" stroke-width="2.6" />
    <line x1="80" y1="22" x2="64" y2="42" stroke="#c084fc" stroke-width="2.6" />
    <line x1="24" y1="92" x2="64" y2="86" stroke="#c084fc" stroke-width="2.6" />
    <line x1="104" y1="92" x2="64" y2="86" stroke="#c084fc" stroke-width="2.6" />
  </g>

  <!-- High-contrast Amber and Violet Sensor Nodes -->
  <circle cx="28" cy="36" r="6" fill="url(#amberGlow)" stroke="#78350f" stroke-width="1.2" />
  <circle cx="48" cy="22" r="5" fill="#c084fc" stroke="#6d28d9" stroke-width="1" />
  <circle cx="80" cy="22" r="6" fill="url(#amberGlow)" stroke="#78350f" stroke-width="1.2" />
  <circle cx="100" cy="38" r="5" fill="#c084fc" stroke="#6d28d9" stroke-width="1" />
  <circle cx="98" cy="68" r="5.5" fill="url(#amberGlow)" stroke="#78350f" stroke-width="1.2" />
  <circle cx="104" cy="92" r="5" fill="#c084fc" stroke="#6d28d9" stroke-width="1" />
  <circle cx="78" cy="106" r="5.5" fill="url(#amberGlow)" stroke="#78350f" stroke-width="1.2" />
  <circle cx="50" cy="106" r="5" fill="#c084fc" stroke="#6d28d9" stroke-width="1" />
  <circle cx="24" cy="92" r="6" fill="url(#amberGlow)" stroke="#78350f" stroke-width="1.2" />
  <circle cx="30" cy="64" r="5" fill="#c084fc" stroke="#6d28d9" stroke-width="1" />

  <!-- Central Telemetry Hexagon Badge -->
  <polygon points="64,36 92,52 92,76 64,92 36,76 36,52" fill="#090d16" stroke="url(#violetGlow)" stroke-width="3.5" />

  <!-- Real-Time Air Quality Telemetry Pulse Waveform -->
  <path d="M 40 64 L 50 64 L 56 50 L 64 78 L 72 56 L 78 64 L 88 64" fill="none" stroke="#c084fc" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Active Telemetry Ingestion Hub Indicator -->
  <circle cx="64" cy="64" r="3.2" fill="#fbbf24" />
</svg>
