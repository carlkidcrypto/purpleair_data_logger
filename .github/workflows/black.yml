name: Black

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '*.py'
      - 'setup.cfg'
      - '.github/workflows/black.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '*.py'
      - 'setup.cfg'
      - '.github/workflows/black.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  black:
    needs: verify-syntax
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_python_black.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      target-paths: '.'
