name: Unit Tests
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-source-changes:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7

      - name: Check for changes in source code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            codecov.yml
            .github/workflows/tests.yml
            purpleair_data_logger/**
            include/**
            src/**
            interface/**
            tools/**
            configs/**
            tests/**
            python_tests/**
            setup.py
            setup.cfg
            pyproject.toml

  Unit_Tests:
    name: ${{ matrix.os }} using Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Checkout purpleair_api C++17 base layer (CalSemVer alpha v2026.11.11a2)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/purpleair_api
          ref: v2026.11.11a2
          path: third_party/purpleair_api

      - name: Set up Python env for running unit tests...
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependencies & Python requirements
        uses: carlkidcrypto/os-specific-runner@v2.5.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y swig libcurl4-openssl-dev pkg-config xvfb tk-dev python3-tk
            python -m pip install --upgrade pip setuptools wheel pytest
            python -m pip install --pre -r tests/requirements.txt || (python -m pip install ./third_party/purpleair_api/python && python -m pip install -r tests/requirements.txt --no-deps)
            python setup.py build_ext --inplace
          macos: |
            brew install swig pkg-config
            python -m pip install --upgrade pip setuptools wheel pytest
            python -m pip install --pre -r tests/requirements.txt || (python -m pip install ./third_party/purpleair_api/python && python -m pip install -r tests/requirements.txt --no-deps)
            python setup.py build_ext --inplace
          windows: |
            choco install swig -y
            python -m pip install --upgrade pip setuptools wheel pytest
            python -m pip install --pre -r tests/requirements.txt || (python -m pip install ./third_party/purpleair_api/python && python -m pip install -r tests/requirements.txt --no-deps)
            python setup.py build_ext --inplace

      - name: Run C++17/SWIG/GUI pytest suite and legacy unittest suite
        uses: carlkidcrypto/os-specific-runner@v2.5.0
        with:
          linux: |
            xvfb-run -a coverage run --data-file=tests/.coverage -m pytest python_tests/ -v
            cd tests
            coverage run --append -m unittest && coverage xml -o ${{matrix.os}}_${{matrix.python-version}}_coverage.xml && coverage json -o ${{matrix.os}}_${{matrix.python-version}}_coverage.json
          macos: |
            coverage run --data-file=tests/.coverage -m pytest python_tests/ -v
            cd tests
            coverage run --append -m unittest && coverage xml -o ${{matrix.os}}_${{matrix.python-version}}_coverage.xml && coverage json -o ${{matrix.os}}_${{matrix.python-version}}_coverage.json
          windows: |
            coverage run --data-file=tests/.coverage -m pytest python_tests/ -v
            cd tests ; coverage run --append -m unittest ; coverage xml -o ${{matrix.os}}_${{matrix.python-version}}_coverage.xml ; coverage json -o ${{matrix.os}}_${{matrix.python-version}}_coverage.json

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/${{matrix.os}}_${{matrix.python-version}}_coverage.xml,tests/coverage.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
