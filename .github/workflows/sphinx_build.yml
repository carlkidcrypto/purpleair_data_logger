---
name: Sphinx Docs Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  sphinx_docs_build:
    needs: verify-syntax
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_sphinx_build.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      python-version: '3.14'
      docs-dir: sphinx_docs_build
      requirements-file: sphinx_docs_build/requirements.txt
      extra-requirements-file: sphinx_docs_build/landing/requirements.txt
      output-dir: docs
      landing-dir: sphinx_docs_build/landing
      deploy-pages: true
      pre-build-cmd: >-
        git clone --depth 1 --branch v2026.11.11a2 https://github.com/carlkidcrypto/purpleair_api.git third_party/purpleair_api &&
        sudo apt-get update &&
        sudo apt-get install -y g++ python3-dev python3-tk swig libcurl4-openssl-dev pkg-config &&
        python -m pip install --upgrade pip setuptools wheel &&
        python -m pip install ./third_party/purpleair_api/python &&
        python -m pip install --no-build-isolation .

  sphinx_docs_build_release:
    needs: verify-syntax
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository code at release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Check out purpleair_api C++17 base layer (v2026.11.11a2)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: carlkidcrypto/purpleair_api
          ref: v2026.11.11a2
          path: third_party/purpleair_api

      - name: Set up Python 3.14 for Sphinx
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev python3-tk swig libcurl4-openssl-dev pkg-config

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sphinx-${{ hashFiles('sphinx_docs_build/requirements.txt', 'sphinx_docs_build/landing/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sphinx-
            ${{ runner.os }}-pip-

      - name: Install documentation requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r sphinx_docs_build/requirements.txt
          python -m pip install -r sphinx_docs_build/landing/requirements.txt
          python -m pip install ./third_party/purpleair_api/python
          python -m pip install --no-build-isolation .

      - name: Build versioned documentation
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p sphinx_docs_build/source/_static sphinx_docs_build/source/_templates
          sphinx-build -b html -W sphinx_docs_build/source "/tmp/html_${VERSION}/"

      - name: Switch to main branch and copy versioned documentation
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          CLEAN_VER=$(echo "${VERSION}" | sed -E 's/^[vV]//')
          NORM_VERSION="html_v${CLEAN_VER}"
          git fetch origin main
          git checkout main
          git pull origin main
          mkdir -p docs
          rm -rf "docs/${NORM_VERSION}"
          cp -r "/tmp/html_${VERSION}" "docs/${NORM_VERSION}"

      - name: Update landing page version list
        run: python .github/scripts/update_landing_versions.py

      - name: Build landing page with updated version list
        run: |
          mkdir -p sphinx_docs_build/landing/source/_static sphinx_docs_build/landing/source/_templates
          make -C sphinx_docs_build/landing clean
          make -C sphinx_docs_build/landing html SPHINXOPTS="-W"
          touch docs/.nojekyll

      - name: Create pull request with versioned docs
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          title: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          body: "Adds Sphinx documentation for release ${{ github.event.release.tag_name }}."
          branch: docs/add-versioned-docs-${{ github.event.release.tag_name }}
          base: main
          delete-branch: true
          add-paths: |
            docs/
            sphinx_docs_build/landing/source/index.rst
