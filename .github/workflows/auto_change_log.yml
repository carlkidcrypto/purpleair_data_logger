name: Update Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to validate/include in the changelog range"
        required: false
        type: string

concurrency:
  group: auto-changelog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    name: Generate and Update CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for existing open changelog PR
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_prs=$(gh pr list --head automation/update-changelog --state open --json number --jq 'length')
          if [ "$open_prs" -gt 0 ]; then
            echo "An open PR from automation/update-changelog already exists. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install git-chglog v0.15.4
        if: steps.check-pr.outputs.skip != 'true'
        run: |
          curl -sSfL https://github.com/git-chglog/git-chglog/releases/download/v0.15.4/git-chglog_0.15.4_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin git-chglog
          git-chglog --version

      - name: Generate and validate changelog
        id: generate
        if: steps.check-pr.outputs.skip != 'true'
        run: |
          git-chglog --config .chglog/config.yml -o CHANGELOG.tmp

          latest_section=$(awk '/^<a name=/{if (found) exit; found=1; next} /^---$/ && found{exit} found{print}' CHANGELOG.tmp)
          if [ -z "$latest_section" ] || ! printf '%s\n' "$latest_section" | grep -qE '^(- |\* )'; then
            echo "::error::Latest tag section in CHANGELOG.tmp is empty or contains no commit bullets."
            rm -f CHANGELOG.tmp
            exit 1
          fi

          if [ -f CHANGELOG.md ]; then
            if head -n 1 CHANGELOG.md | grep -q '^Last Updated:'; then
              tail -n +3 CHANGELOG.md > CHANGELOG.existing.tmp
            else
              cp CHANGELOG.md CHANGELOG.existing.tmp
            fi
          else
            : > CHANGELOG.existing.tmp
          fi

          if cmp -s CHANGELOG.existing.tmp CHANGELOG.tmp; then
            echo "No substantive changes to CHANGELOG.md (ignoring Last Updated timestamp)."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            rm -f CHANGELOG.tmp CHANGELOG.existing.tmp
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          {
            printf 'Last Updated: %s\n\n' "$timestamp"
            cat CHANGELOG.tmp
          } > CHANGELOG.md
          rm -f CHANGELOG.tmp CHANGELOG.existing.tmp

      - name: Commit and open pull request
        if: steps.check-pr.outputs.skip != 'true' && steps.generate.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            current_tag="$INPUT_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            current_tag="$RELEASE_TAG"
          else
            current_tag=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
          fi

          base_tag=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          range="${base_tag}...${current_tag}"
          commit_log=$(git log --oneline "${base_tag}..${current_tag}" 2>/dev/null || git log --oneline -n 20)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B automation/update-changelog
          git add CHANGELOG.md
          git commit -m "docs(changelog): update CHANGELOG.md for ${current_tag}"
          git push --force-with-lease origin automation/update-changelog

          pr_body=$(mktemp)
          {
            echo "## Summary"
            echo "Automated \`CHANGELOG.md\` update generated by \`git-chglog\`."
            echo ""
            echo "- **Trigger**: \`${EVENT_NAME}\`"
            echo "- **Range**: \`${range}\`"
            echo ""
            echo "## Commits"
            echo '```text'
            printf '%s\n' "$commit_log"
            echo '```'
          } > "$pr_body"

          gh pr create \
            --base main \
            --head automation/update-changelog \
            --title "[changelog] Update CHANGELOG.md for ${current_tag}" \
            --body-file "$pr_body"
          rm -f "$pr_body"
