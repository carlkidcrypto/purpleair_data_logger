name: Update Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to validate/include in the changelog range"
        required: false
        type: string

concurrency:
  group: auto-changelog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    permissions:
      contents: write
      pull-requests: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_auto_changelog.yml@3178143deee5927b0b131bafef683efe8b2484b5
    with:
      tag: ${{ inputs.tag }}
