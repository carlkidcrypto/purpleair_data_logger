name: Clang-format

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'include/**/*.h'
      - 'src/**/*.cpp'
      - 'cpp_tests/**/*.h'
      - 'cpp_tests/**/*.cpp'
      - '.clang-format'
      - '.github/workflows/clang_format.yml'
  pull_request:
    branches: [main]
    paths:
      - 'include/**/*.h'
      - 'src/**/*.cpp'
      - 'cpp_tests/**/*.h'
      - 'cpp_tests/**/*.cpp'
      - '.clang-format'
      - '.github/workflows/clang_format.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml
  check-formatting:
    needs: verify-syntax
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_clang_format.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      target-dirs: 'include src cpp_tests'
      file-extensions: 'h cpp'
      clang-format-version: '20'
      exclude-files: 'purpleair_data_logger_wrap.cxx'
      auto-fix-pr: false
