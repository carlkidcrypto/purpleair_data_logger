---
# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: TestPyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-test-pypi:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_pypi_publish.yml@14e025f6c182b7b20718538f533ca467a9ff9c6c
    with:
      target: testpypi
      environment-name: build_and_publish_to_test_pypi
      build-mode: pure-python
      python-version: '3.14'
      check-changes: true
      changed-files-patterns: |
        .github/workflows/build_and_publish_to_test_pypi.yml
        setup.py
        setup.cfg
      skip-existing: true
