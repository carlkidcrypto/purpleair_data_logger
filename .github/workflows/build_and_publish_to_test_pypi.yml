---
# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: TestPyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pypi:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_pypi_publish.yml@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
    with:
      target: testpypi
      environment-name: build_and_publish_to_test_pypi
      build-mode: cibuildwheel
      matrix-json: >-
        [{"os":"ubuntu-latest","arch":"x86_64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"},
        {"os":"windows-latest","arch":"AMD64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"},
        {"os":"macos-latest","arch":"arm64","cibw-build":"cp311-* cp312-* cp313-* cp314-*"}]
      python-version: '3.11'
      third-party-repo: carlkidcrypto/purpleair_api
      third-party-ref: v2026.11.24b0
      third-party-path: third_party/purpleair_api
      check-changes: true
      changed-files-patterns: |
        .github/workflows/build_and_publish_to_test_pypi.yml
        pyproject.toml
        setup.py
        setup.cfg
        purpleair_data_logger/**
        include/**
        src/**
        interface/**
      skip-existing: true
      skip-publish: true

  publish:
    needs: build-test-pypi
    if: ${{ needs.build-test-pypi.outputs.artifacts-built == 'true' }}
    name: Publish distribution to TestPyPI
    runs-on: ubuntu-latest
    environment: build_and_publish_to_test_pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish distribution to TestPyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1.14
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
