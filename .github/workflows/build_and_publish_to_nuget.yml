---
name: NuGet Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  build-runtimes:
    needs: verify-syntax
    if: ${{ always() && (needs.verify-syntax.result == 'success' || needs.verify-syntax.result == 'skipped') }}
    name: Build C# native runtime for ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout purpleair_api C++17 base layer (v2026.11.26)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: carlkidcrypto/purpleair_api
          ref: v2026.11.26
          path: third_party/purpleair_api

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install system dependencies
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7  # v2.5.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y swig libcurl4-openssl-dev pkg-config patchelf build-essential cmake
          macos: |
            brew install swig pkg-config
          windows: |
            choco install swig -y

      - name: Build native C# runtime
        shell: bash
        run: |
          python3 bindings/csharp/build_self_contained.py

      - name: Upload C# runtime artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: csharp-runtime-${{ matrix.rid }}
          path: bindings/csharp/runtimes/${{ matrix.rid }}/**
          retention-days: 7

  pack-and-publish-nuget:
    needs: [verify-syntax, build-runtimes]
    if: >-
      ${{ always() &&
      (needs.verify-syntax.result == 'success' || needs.verify-syntax.result == 'skipped') &&
      needs.build-runtimes.result == 'success' }}
    name: Pack and Publish to NuGet
    runs-on: ubuntu-latest
    environment: build_and_publish_to_nuget
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Generate SWIG C# wrappers
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y swig
          python3 tools/generate_swig_bindings.py --languages csharp --out-dir bindings/csharp/generated

      - name: Download all C# runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: csharp-runtime-*
          path: bindings/csharp/runtimes
          merge-multiple: true

      - name: Build and Pack NuGet Package
        shell: bash
        run: dotnet pack bindings/csharp/PurpleAirDataLogger.csproj -c Release -o dist-nuget

      - name: Upload NuGet Package Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nuget-package
          path: dist-nuget/*.nupkg
          retention-days: 7

      - name: Authenticate with NuGet.org (OIDC Trusted Publishing)
        if: env.NUGET_API_KEY == ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: carlkidcrypto-nuget

      - name: Publish to NuGet.org
        shell: bash
        run: |
          API_KEY="${NUGET_API_KEY:-${{ steps.nuget-login.outputs.NUGET_API_KEY }}}"
          if [ -n "$API_KEY" ]; then
            dotnet nuget push dist-nuget/*.nupkg \
              --api-key "$API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          else
            echo "::warning::No NuGet authentication provided; skipping NuGet.org upload."
          fi

      - name: Publish to GitHub Packages
        if: env.GH_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source \
            --username carlkidcrypto \
            --password "$GH_TOKEN" \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/carlkidcrypto/index.json" || true
          dotnet nuget push dist-nuget/*.nupkg \
            --api-key "$GH_TOKEN" \
            --source github \
            --skip-duplicate || true
