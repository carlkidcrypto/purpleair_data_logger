name: "CodeQL"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'

  schedule:
    - cron: '0 0 * * *'

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  analyze:
    needs: verify-syntax
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
