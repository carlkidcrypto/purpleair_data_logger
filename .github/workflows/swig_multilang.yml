---
name: SWIG 4-Language Bindings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'python_tests/**'
      - 'cpp_tests/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'python_tests/**'
      - 'cpp_tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swig-multilang:
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_swig_multilang.yml@3538efdfabdbcf0ae956cfc5685fd4c21a59696b
