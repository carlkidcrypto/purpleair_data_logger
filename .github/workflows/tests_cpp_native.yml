name: Tests C++ Native

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in C++ native code
        id: changed-files
        uses: carlkidcrypto/shared-workflows/actions/check-source-changes@f1f9056d69addcc7b59be128e417a9e7338cbdab
        with:
          files: |
            codecov.yml
            include/**
            src/**
            cpp_tests/**
            meson.build
            meson_options.txt
            CMakeLists.txt
            tools/prepare_sqlite3_amalgamation.py
            tools/prepare_purpleair_api_source.py
            .github/workflows/tests_cpp_native.yml

  cpp-meson-tests:
    needs: [verify-syntax, check-source-changes]
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_tests_cpp_native.yml@f1f9056d69addcc7b59be128e417a9e7338cbdab
    with:
      install-netsnmp: false
      codecov-flags: 'cpp'
      pre-build-cmd: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config \
            libcurl4-openssl-dev libpq-dev libgtest-dev lcov gcovr curl
          python3 -m pip install --upgrade pip gcovr
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install meson ninja pkg-config googletest
        fi
        python3 tools/prepare_purpleair_api_source.py
        python3 tools/prepare_sqlite3_amalgamation.py
      test-command: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          set +e
          meson test -C build -v
          TEST_EXIT_CODE=$?
          gcovr -r . --filter "src/" --filter "include/" --xml -o coverage.xml --exclude-throw-branches --exclude-unreachable-branches --exclude-branches-by-pattern ".*" || ninja -C build coverage-xml || true
          cp coverage.xml build/meson-logs/coverage.xml 2>/dev/null || true
          exit $TEST_EXIT_CODE
        else
          meson test -C build -v
        fi
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
