---
name: Go Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - 'bindings/go/**'
      - '.github/workflows/build_and_publish_to_go.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  publish-go:
    name: Build and Verify Go Distribution
    runs-on: ubuntu-latest
    needs: verify-syntax
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout purpleair_api C++17 base layer (v2026.11.24b0)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: carlkidcrypto/purpleair_api
          ref: v2026.11.24b0
          path: third_party/purpleair_api

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: '1.23'

      - name: Install system dependencies & SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig libcurl4-openssl-dev pkg-config patchelf build-essential cmake

      - name: Build self-contained Go bindings
        run: python3 bindings/go/build_self_contained.py

      - name: Verify Go module
        working-directory: ./bindings/go
        env:
          CGO_CXXFLAGS: >-
            -std=c++17
            -I${{ github.workspace }}/include
            -I${{ github.workspace }}/third_party/purpleair_api/include
          CGO_LDFLAGS: >-
            -L${{ github.workspace }}/bindings/go/lib
            -lpurpleair_data_logger
            -Wl,-rpath,${{ github.workspace }}/bindings/go/lib
            -pthread
        run: |
          go vet .
          go test -v .

      - name: Package Go module archive
        run: |
          mkdir -p dist-go
          tar -czf dist-go/purpleair_data_logger-go.tar.gz -C bindings/go .

      - name: Upload Go Module Archive Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-module-archive
          path: dist-go/*.tar.gz

      - name: Pre-warm Go module proxy
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if [ -n "$TAG" ]; then
            echo "Pre-warming Go module proxy for github.com/carlkidcrypto/purpleair_data_logger/bindings/go@${TAG}..."
            GOPROXY=https://proxy.golang.org go list -m \
              "github.com/carlkidcrypto/purpleair_data_logger/bindings/go@${TAG}" \
              || echo "Notice: Go proxy indexing will complete once release tag is indexed."
          fi
