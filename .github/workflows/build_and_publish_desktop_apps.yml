---
name: Desktop Distributions (EXE & DMG)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [created, published]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'cpp_tests/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach desktop assets to (e.g. v2026.11.24b0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for changes in desktop application files
        id: changed-files
        uses: carlkidcrypto/shared-workflows/actions/check-source-changes@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
        with:
          files: |
            include/**
            src/**
            interface/**
            purpleair_data_logger/**
            configs/**
            tools/**
            pyproject.toml
            setup.cfg
            setup.py
            .github/workflows/build_and_publish_desktop_apps.yml

  package-desktop-apps:
    name: Package Desktop App (${{ matrix.os }})
    needs: [verify-syntax, check-source-changes]
    if: >-
      (github.event_name == 'release' && (github.event.action == 'published' || (github.event.action == 'created' && github.event.release.draft == true))) ||
      (github.event_name != 'release' && (needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout purpleair_data_logger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout purpleair_api C++17 base layer (v2026.11.24b0)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: carlkidcrypto/purpleair_api
          ref: v2026.11.24b0
          path: third_party/purpleair_api

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Provision embedded SQLite3 amalgamation
        run: python tools/prepare_sqlite3_amalgamation.py

      - name: Install system dependencies
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7  # v2.5.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential swig pkg-config patchelf \
              libcurl4-openssl-dev python3-tk rpm curl
          macos: |
            brew install swig pkg-config
          windows: |
            choco install swig innosetup -y

      - name: Build C++ extension and package standalone desktop app
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7  # v2.5.0
        with:
          linux: |
            python -m pip install --pre --upgrade pip setuptools wheel pyinstaller "purpleair_api>=2026.11.24b0"
            python setup.py build_ext --inplace
            python tools/package_desktop_app.py --platform linux
          macos: |
            python -m pip install --pre --upgrade pip setuptools wheel pyinstaller "purpleair_api>=2026.11.24b0"
            python setup.py build_ext --inplace
            python tools/package_desktop_app.py --platform macos
          windows: |
            $ErrorActionPreference = 'Stop'
            python -m pip install --pre --upgrade pip setuptools wheel pyinstaller "purpleair_api>=2026.11.24b0"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python setup.py build_ext --inplace
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/package_desktop_app.py --platform windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload desktop artifacts to workflow run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: desktop-dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  publish-release-assets:
    name: Publish Desktop Assets to GitHub Release
    needs: [verify-syntax, package-desktop-apps]
    if: >-
      (github.event_name == 'release' && (github.event.action == 'published' || (github.event.action == 'created' && github.event.release.draft == true))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: desktop-dist-*
          path: all-desktop-dist
          merge-multiple: true

      - name: Publish all desktop assets to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET_TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          if [ -z "$TARGET_TAG" ] && [ "${{ github.event_name }}" = "release" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TARGET_TAG" ]; then
            echo "Target release tag not specified; skipping GitHub Release asset upload."
            exit 0
          fi

          echo "Target Release Tag: ${TARGET_TAG}"
          echo "Target Repository: ${{ github.repository }}"
          if ! gh release view "${TARGET_TAG}" --repo "${{ github.repository }}"; then
            echo "::error::GitHub Release ${TARGET_TAG} not found in repository ${{ github.repository }}."
            exit 1
          fi

          shopt -s nullglob
          ASSETS=(
            all-desktop-dist/*.exe
            all-desktop-dist/*.dmg
            all-desktop-dist/*.deb
            all-desktop-dist/*.rpm
            all-desktop-dist/*.zip
            all-desktop-dist/*.tar.gz
          )

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No desktop artifacts found to upload in all-desktop-dist/"
            exit 1
          fi

          IS_IMMUTABLE=$(gh api "repos/${{ github.repository }}/releases/tags/$TARGET_TAG" --jq '.immutable // false' 2>/dev/null || echo "false")
          if [ "$IS_IMMUTABLE" = "true" ]; then
            echo "::warning::Release ${TARGET_TAG} is immutable. Skipping gh release upload; artifacts remain attached to the workflow run."
            exit 0
          fi

          for asset in "${ASSETS[@]}"; do
            echo "Uploading asset: ${asset} to release ${TARGET_TAG} ..."
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "${TARGET_TAG}" "${asset}" --repo "${{ github.repository }}" --clobber; then
                uploaded=1
                break
              fi
              echo "Upload failed for ${asset} (attempt ${attempt}/3). Retrying in 5s..."
              sleep 5
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::Failed to upload ${asset} after 3 attempts."
              exit 1
            fi
          done
          echo "All desktop release assets published successfully to ${TARGET_TAG}."
