name: Build and Publish Distribution
description: Build sdist and wheel, and publish to PyPI or Test PyPI.

inputs:
  target:
    description: Target repository ('pypi' or 'test_pypi')
    required: false
    default: "pypi"
  packages-dir:
    description: Directory containing distributions to publish
    required: false
    default: "dist/"
  pypi-token:
    description: Optional PyPI token/password if not using OIDC trusted publishing
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install pypa/build
      shell: bash
      run: |
        python -m pip install build --user

    - name: Build a binary wheel and a source tarball
      shell: bash
      run: |
        python -m build --sdist --wheel --outdir ${{ inputs.packages-dir }} .

    - name: Publish distribution 📦 to PyPI
      if: inputs.target == 'pypi' && inputs.pypi-token == ''
      uses: pypa/gh-action-pypi-publish@release/v1.14
      with:
        packages-dir: ${{ inputs.packages-dir }}
        print-hash: true

    - name: Publish distribution 📦 to PyPI with token
      if: inputs.target == 'pypi' && inputs.pypi-token != ''
      uses: pypa/gh-action-pypi-publish@release/v1.14
      with:
        packages-dir: ${{ inputs.packages-dir }}
        print-hash: true
        password: ${{ inputs.pypi-token }}

    - name: Publish distribution 📦 to Test PyPI
      if: (inputs.target == 'test_pypi' || inputs.target == 'testpypi') && inputs.pypi-token == ''
      uses: pypa/gh-action-pypi-publish@release/v1.14
      with:
        packages-dir: ${{ inputs.packages-dir }}
        skip-existing: true
        print-hash: true
        repository-url: https://test.pypi.org/legacy/

    - name: Publish distribution 📦 to Test PyPI with token
      if: (inputs.target == 'test_pypi' || inputs.target == 'testpypi') && inputs.pypi-token != ''
      uses: pypa/gh-action-pypi-publish@release/v1.14
      with:
        packages-dir: ${{ inputs.packages-dir }}
        skip-existing: true
        print-hash: true
        repository-url: https://test.pypi.org/legacy/
        password: ${{ inputs.pypi-token }}
