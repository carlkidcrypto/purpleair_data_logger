[metadata]
name = purpleair_data_logger
version = 2026.11.3a0
author = carlkidcrypto
description = A C++17 and Python data logger & Studio GUI for collecting data from PurpleAir sensors via purpleair_api.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/carlkidcrypto/purpleair_data_logger
project_urls =
    Bug Tracker = https://github.com/carlkidcrypto/purpleair_data_logger/issues
classifiers =
    Programming Language :: C++
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Development Status :: 5 - Production/Stable

[options]
packages =
    purpleair_data_logger
    purpleair_data_logger.gui
python_requires = >=3.11
include_package_data = True
install_requires =
    purpleair_api>=2026.11.11a2
    pg8000>=1.29.4
    requests>=2.32.3
    prometheus_client>=0.20.0

[options.package_data]
purpleair_data_logger =
    *.so
    *.pyd
    *.dll
    .dylibs/*
    libs/*
purpleair_data_logger.gui =
    locale.json
    static/*

[options.entry_points]
console_scripts =
    purpleair-data-logger = purpleair_data_logger.cli:main
    purpleair-data-logger-gui = purpleair_data_logger.cli:main_gui
