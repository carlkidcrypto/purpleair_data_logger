style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/carlkidcrypto/purpleair_data_logger
options:
  commit_groups:
    title_maps:
      feat: Features
      fix: Bug Fixes
      perf: Performance Improvements
      refactor: Code Refactoring
      docs: Documentation Updates
      chore: Maintenance
      build: Build System
      ci: Continuous Integration
      test: Tests
      style: Styles
      revert: Reverts
      Bump: Dependency Updates
      Release: Releases
      Add: Additions
      Fix: Bug Fixes
      Update: Updates
      Refactor: Code Refactoring
      Document: Documentation Updates
      Enhance: Enhancements
      Hotfix: Hotfixes
      Initial: Initial Commits
      Merge: Merges
      other: Other Changes
  header:
    pattern: "^\\s*((?:\\[[^\\]]+\\]\\s*)?([\\w]*)(?:\\([^)]*\\))?!?.*)$"
    pattern_maps:
      - Subject
      - Type
  notes:
    keywords:
      - BREAKING CHANGE
